<!DOCTYPE html>
<html>
<head>
    <title>Azure AD Login Test</title>
</head>
<body>
    <h1>Azure AD Login Test</h1>
    <button onclick="testLogin()">Test Direct Login</button>
    <div id="result"></div>

    <script>
        function testLogin() {
            console.log('Testing login...');
            document.getElementById('result').innerHTML = 'Redirecting to backend...';
            
            // Add some debug info
            console.log('Current origin:', window.location.origin);
            console.log('Target URL:', 'http://localhost:8000/auth/login');
            
            // Redirect to backend login
            window.location.href = 'http://localhost:8000/auth/login';
        }
        
        // Check if we're on the callback page
        if (window.location.pathname === '/callback') {
            console.log('On callback page');
            document.getElementById('result').innerHTML = 'Callback page loaded';
        }
    </script>
</body>
</html>
